format_version: 1
description: Consolidated COCO-Dev-50 coarse-to-fine Stage-A search profiles.

shared:
  dataset: &dataset
    path: data/coco/coco_dev50.jsonl
    split_metadata: data/coco/coco_caption_splits.json
    sha256: 940030cc9f07a787f2041ea8144f831ad65a33cd2a55ee116f74ca4710b35754
    expected_prompts: 50
    expected_categories: 1
