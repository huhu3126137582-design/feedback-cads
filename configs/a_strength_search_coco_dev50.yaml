    resolution: 512
    dtype: float16
  cads: &cads
    noise_scale: 0.20
    rescale: true
    rescale_mix: 0.70
    hold_until_progress: 0.10
    hard_off_progress: 0.60
    content_tokens_only: true
    clean_unconditional: true
  randomness: &randomness
    latent_seed_base: 320000
    latent_prompt_stride: 1000
    condition_seed_base: 2920000
    condition_prompt_stride: 100003
    paired_latents_across_rho: true
    shared_condition_bank_across_nonzero_rho: true
  evaluation: &evaluation
    dino_model: facebook/dinov2-base
    clip_model: sentence-transformers/clip-ViT-B-32
    clipscore_weight: 2.5
    hps_version: v2.1
    bootstrap_replicates: 10000
    bootstrap_seed: 20260808

